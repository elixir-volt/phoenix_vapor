name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    uses: elixir-vibe/actions/.github/workflows/elixir-ci.yml@v1
    with:
      # The tests render Reka UI and Vue from node_modules.
      min-command: mix npm.install && mix compile --warnings-as-errors && mix test
